<!doctype html>
<html lang="vi">
  <head>
  	<title>SONUS TACTIC — Đăng nhập</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/voice-assistant.css">
	<script src="js/i18n.js"></script>
	<script>
		(function () {
			try {
				var lang = localStorage.getItem('sonus-lang');
				if (!lang || !window.SonusI18n || !window.SonusI18n.strings[lang]) {
					lang = 'vi';
				}
				document.documentElement.lang = lang;
			} catch (e) {}
		})();
	</script>

	</head>
	<body class="img js-fullheight" style="background-image: url(images/bg.jpg);" data-i18n-page-title="page.login.title">
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">CHÀO MỪNG ĐẾN VỚI SONUS TACTIC</h2>
					<p class="heading-subtitle">Nền tảng học piano dành cho người khiếm thị</p>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
		      	<h3 class="mb-4 text-center">Bạn đã có tài khoản?</h3>
		      	<form action="#" class="signin-form" novalidate>
		      		<div class="form-group">
		      			<input type="text" id="username-field" name="username" class="form-control" placeholder="Tên đăng nhập" minlength="3" maxlength="30" autocomplete="username" required>
		      			<small class="form-error" id="username-error" aria-live="polite"></small>
		      		</div>
	            <div class="form-group">
	              <input id="password-field" type="password" name="password" class="form-control" placeholder="Mật khẩu" minlength="6" maxlength="50" autocomplete="current-password" required>
	              <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password" aria-label="Hiện hoặc ẩn mật khẩu"></span>
	              <small class="form-error" id="password-error" aria-live="polite"></small>
	            </div>
	            <div class="form-group">
	            	<button type="submit" class="form-control btn btn-primary submit px-3">Đăng nhập</button>
	            </div>
	            <div class="form-group d-md-flex">
	            	<div class="w-50">
		            	<label class="checkbox-wrap checkbox-primary">Ghi nhớ đăng nhập
									  <input type="checkbox" checked>
									  <span class="checkmark"></span>
									</label>
								</div>
								<div class="w-50 text-md-right">
									<a href="#" style="color: #fff">Quên mật khẩu?</a>
								</div>
	            </div>
	          </form>
	          <p class="w-100 text-center">&mdash; Chưa có tài khoản? &mdash;</p>
	          <div class="social d-flex text-center">
	          	<a href="#" class="px-2 py-2 mr-md-1 rounded">Đăng ký học thử miễn phí</a>
	          </div>
		      </div>
				</div>
			</div>
		</div>
	</section>

	<script src="js/jquery.min.js"></script>
  <script src="js/popper.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lesson-courses.js"></script>
  <script src="js/voice-i18n.js"></script>
  <script src="js/language-switcher.js"></script>
  <script src="js/voice-lessons.js"></script>
  <script src="js/voice-assistant.js"></script>

	</body>
</html>
